<section class="section section--tight" aria-labelledby="band-title">
  <div class="wrap band">
    <div class="reveal">
      <p class="band__kicker">{{band.kicker}}</p>
      <h2 class="band__title" id="band-title">{{band.title}}</h2>
    </div>
    <div class="band__form reveal" style="--d:.1s" data-form-wrap>
      <form class="form" data-form="callback" data-form-id="footer_band" data-project="{{band.project}}" novalidate>
        <div class="field"><input id="bf-name" name="name" type="text" placeholder=" " autocomplete="name" required maxlength="80"><label for="bf-name">Enter your Full Name *</label></div>
        <div class="field"><input id="bf-phone" name="phone" type="tel" placeholder=" " autocomplete="tel" inputmode="tel" required maxlength="16"><label for="bf-phone">Enter your Contact Number *</label></div>
        <div class="field full"><input id="bf-email" name="email" type="email" placeholder=" " autocomplete="email" maxlength="120"><label for="bf-email">Enter your Email Address</label></div>
        <div class="hp" aria-hidden="true"><label>Company <input name="company" tabindex="-1" autocomplete="off"></label></div>
        <div class="full form__foot">
          <span class="form__note">Your details are only used to respond to your enquiry.</span>
          <button class="btn" type="submit">Request a Call Back</button>
        </div>
      </form>
      <div class="form-done" role="status">{{@icon check-circle}}<h3>Thank you!</h3><p>Our representative will call you shortly.</p></div>
    </div>
  </div>
</section>
